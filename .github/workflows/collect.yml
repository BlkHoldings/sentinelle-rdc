name: Collect open sources

# Server-side, around the clock. Reads public feeds a browser cannot
# (Congolese press RSS, no CORS) and GDELT without a shared-IP rate
# limit, then commits the snapshot to the orphan `data` branch. The live
# site reads that branch directly, so data refreshes with no rebuild.

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (for the collector script)
        uses: actions/checkout@v4
        with:
          path: code

      - name: Checkout data branch (create if missing)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
        continue-on-error: true

      - name: Ensure data branch exists
        run: |
          if [ ! -d data/.git ]; then
            mkdir -p data && cd data && git init -q
            git checkout -q --orphan data
            git config user.name "nkoyi-collector"
            git config user.email "collector@users.noreply.github.com"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect
        env:
          OUT_DIR: ${{ github.workspace }}/data
        run: node code/scripts/collect.mjs

      - name: Commit snapshot if changed
        run: |
          cd data
          git config user.name "nkoyi-collector"
          git config user.email "collector@users.noreply.github.com"
          git add wire.json manifest.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -q -m "data: snapshot $(date -u +%FT%TZ)"
            git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:data
          fi
